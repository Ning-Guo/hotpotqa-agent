global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # HotpotQA agent — /metrics endpoint exposed by prometheus-client
  - job_name: hotpotqa-agent
    static_configs:
      - targets:
          - host.docker.internal:8000  # reaches the host from inside Docker on Linux
    metrics_path: /metrics

  # Host OS metrics (CPU, disk, network)
  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
